name: LidarCamTrack
options:
  bundleIdPrefix: com.lidarcamtrack
  deploymentTarget:
    iOS: "17.0"

targets:
  LidarCamTrack:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        NSCameraUsageDescription: "Needed to record video and track the camera position with ARKit and LiDAR."
        NSMicrophoneUsageDescription: "Needed to record audio alongside video."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities:
          - arkit
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarcamtrack.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
